<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Subway Runner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="score-pill">Score: <span id="score">0</span></div>
      <div class="score-pill">Best: <span id="best-score">0</span></div>
      <div class="audio-controls">
        <label>
          Volume
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" />
        </label>
        <button id="mute-btn" type="button">Mute</button>
      </div>
    </div>

    <div id="start-screen" class="overlay visible">
      <div class="panel">
        <h1>Neon Subway Runner</h1>
        <p>Colorful 3-lane endless runner with jump + slide timing.</p>
        <p class="controls">← → lane switch · ↑ jump · ↓ slide</p>
        <button id="start-btn" type="button">Start Run</button>
      </div>
    </div>

    <div id="game-over-screen" class="overlay">
      <div class="panel">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <p>Best: <span id="final-best-score">0</span></p>
        <button id="restart-btn" type="button">Restart</button>
      </div>
    </div>

    <div id="speed-lines"></div>
    <canvas id="game-canvas"></canvas>

    <script type="module" src="main.js"></script>
  </body>
</html>
